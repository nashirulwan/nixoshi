blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 3
blur_params_noise = 0.0
blur_params_brightness = 1.15
blur_params_contrast = 1.1
blur_params_saturation = 1.4

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=11
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=160
animation_duration_tag=250
animation_duration_close=140
animation_duration_focus=0
# ease-out-cubic (CSS) = 0.33,1,0.68,1
animation_curve_open=0.33,1,0.68,1
animation_curve_move=0.33,1,0.68,1
animation_curve_tag=0.33,1,0.68,1
animation_curve_close=0.33,1,0.68,1
animation_curve_focus=0.33,1,0.68,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.33,1,0.68,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack layout
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0
mouse_accel_speed=0.4

# Appearance
gappih=3
gappiv=3
gappoh=5
gappov=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

# Layout per tag (tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ===================== MONITOR =====================
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:200

# ===================== WINDOW RULES =====================
# Picture-in-Picture: floating kecil di pojok kanan atas (mirip niri)
windowrule=isfloating:1,isnoborder:1,isnoshadow:1,noblur:1,isglobal:1,offsetx:96,offsety:-96,width:480,height:270,title:^Picture[ -]in[ -][Pp]icture$

# ===================== KEY BINDINGS =====================
# reload config
bind=SUPER,r,reload_config

# menu & terminal
bind=SUPER,space,spawn,noctalia-shell ipc call launcher toggle
bind=SUPER,Return,spawn,kitty
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER,e,spawn,nautilus
bind=SUPER,w,spawn,zen
bind=SUPER,z,spawn,zeditor

# fokus window
bind=ALT,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# tukar posisi window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# status window
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,v,togglefloating,
bind=SUPER,d,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# dwindle layout (manual split)
bind=alt+shift,Return,dwindle_toggle_split_direction

# ganti layout
bind=SUPER,n,switch_layout

# pindah tag
bind=SUPER,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright_have_client,0

# lihat tag N
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# geser tag
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

# pindahkan window ke tag N
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# pindah monitor
bind=SUPER,Up,focusmon,left
bind=SUPER,Down,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# geser window (floating)
bind=SUPER+CTRL,Up,movewin,+0,-50
bind=SUPER+CTRL,Down,movewin,+0,+50
bind=SUPER+CTRL,Left,movewin,-50,+0
bind=SUPER+CTRL,Right,movewin,+50,+0

# resize window (floating)
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Scroll + SUPER -> pindah tag
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Noctalia: matikan blur di belakang panel agar layar tidak ikut blur saat expand
layerrule=noblur:1,layer_name:noctalia-shell

# ===================== buttons =====================
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,noctalia-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,noctalia-shell ipc call volume muteOutput
bind=NONE,XF86AudioMicMute,spawn,noctalia-shell ipc call volume muteInput

bind=NONE,XF86MonBrightnessUp,spawn,noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,noctalia-shell ipc call brightness decrease

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=SUPER+SHIFT,p,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=SUPER+SHIFT,n,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=SUPER+SHIFT,b,spawn,playerctl previous

bind=SUPER+Alt,o,spawn,mango-toggle-edp

bind=SHIFT,Print,spawn_shell,grim "$HOME/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png"
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png"
bind=CTRL,Print,spawn_shell,grim - | wl-copy
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy

# ===================== Noctalia =====================
# Bar & Dock
bind=SUPER,b,spawn,noctalia-shell ipc call bar toggle
bind=SUPER+CTRL,m,spawn,noctalia-shell ipc call dock toggle

# Panel & Widget
bind=SUPER+CTRL,t,spawn,noctalia-shell ipc call controlCenter toggle
bind=SUPER+CTRL,n,spawn,noctalia-shell ipc call notifications toggleHistory
bind=SUPER+CTRL,d,spawn,noctalia-shell ipc call notifications toggleDND
bind=SUPER+CTRL,s,spawn,noctalia-shell ipc call settings toggle
bind=SUPER+CTRL,c,spawn,noctalia-shell ipc call settings toggleTab colorscheme
bind=SUPER+CTRL,v,spawn,noctalia-shell ipc call volume togglePanel
bind=SUPER+CTRL,a,spawn,noctalia-shell ipc call calendar toggle
bind=SUPER+CTRL,i,spawn,noctalia-shell ipc call idleInhibitor toggle

# Wallpaper
bind=SUPER+SHIFT,w,spawn,noctalia-shell ipc call wallpaper toggle
bind=SUPER+CTRL,w,spawn,noctalia-shell ipc call wallpaper random all

# Session & Lock
bind=SUPER,P,spawn,noctalia-shell ipc call sessionMenu toggle
bind=SUPER,Escape,spawn,noctalia-shell ipc call lockScreen lock

# Mode
bind=SUPER+ALT,D,spawn,noctalia-shell ipc call darkMode toggle
bind=SUPER+ALT,N,spawn,noctalia-shell ipc call nightLight toggle

# Clipboard & Emoji
bind=SUPER,C,spawn,noctalia-shell ipc call launcher clipboard
bind=SUPER,Period,spawn,noctalia-shell ipc call launcher emoji

# WARNA MATUGEN
source-optional=~/.config/mango/noctalia.conf
